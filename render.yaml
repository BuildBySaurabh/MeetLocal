# Render Blueprint for MeetLocal: a Node signaling service plus a static site.
# Deploy: push this repo to GitHub, then Render dashboard > New > Blueprint.
# Values marked "sync: false" are asked for in the dashboard and are not stored in this file.
#
# Order matters: create the signaling service first, note its URL, then set
#   meetlocal-web:       VITE_SIGNALING_URL = wss://<signaling host>   (build-time; redeploy after changing)
#   meetlocal-signaling: ALLOWED_ORIGINS    = https://<web host>      (exact origin, no trailing slash)
#
# Not covered: TURN. Without a relay, some networks cannot connect (see docs/DEPLOYMENT.md).
# Render's free web services sleep when idle and lose in-memory rooms on restart.
services:
  - type: web
    name: meetlocal-signaling
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts && npm run build:shared && npm run build -w @meetlocal/signaling
    startCommand: npm run start -w @meetlocal/signaling
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_ROOMS
        value: "500"

  - type: web
    name: meetlocal-web
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build:shared && npm run build -w @meetlocal/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_SIGNALING_URL
        sync: false
      - key: VITE_STUN_URLS
        value: stun:stun.l.google.com:19302
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        # Tighten connect-src to your exact signaling origin once you know it.
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' wss://*.onrender.com http://localhost:11434 http://127.0.0.1:11434 https://huggingface.co https://*.huggingface.co https://*.hf.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /sw.js
        name: Cache-Control
        value: no-cache
